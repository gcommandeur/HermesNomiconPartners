name: CI

on:
  push:
    branches: [main, entwicklung]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      # Kein Postgres-Service-Container: die Testsuite laeuft (siehe
      # tests/conftest.py) komplett gegen eine In-Memory-SQLite-DB und
      # braucht dafuer keine externe Infrastruktur. CC_CRM_DATABASE_URL
      # zeigt hier nur auf eine wegwerfbare lokale SQLite-Datei, damit der
      # FastAPI-Lifespan-Hook (ensure_database_at_head(), laeuft bei jedem
      # App-Start inkl. TestClient) nicht versucht, sich mit dem
      # Postgres-Default aus core/config.py zu verbinden.
      - name: Pytest
        env:
          CC_CRM_DATABASE_URL: "sqlite:///./cc_crm_ci.db"
          CC_CRM_ENVIRONMENT: "local"
        run: pytest

  # Dieselbe Testsuite zusaetzlich gegen ECHTES Postgres 16 (produktiv laeuft
  # Postgres, der Job oben nutzt SQLite). Zusaetzlich: Migrationen von leer bis
  # head, ein Schritt zurueck und wieder hoch, und `alembic check` (Modelle und
  # Migrationen duerfen nicht auseinanderlaufen). tests/conftest.py legt das
  # Schema ueber die Migrationen an und leert die Tabellen nach jedem Test.
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cc_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CC_CRM_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/cc_crm_test"
      CC_CRM_TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/cc_crm_test"
      CC_CRM_ENVIRONMENT: "local"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Reine Testdatenbank im Wegwerf-Container: Dauerhaftigkeit ist egal,
      # Geschwindigkeit nicht (Tabellen werden nach jedem Test geleert).
      - name: Postgres fuer Tests beschleunigen
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
        continue-on-error: true

      - name: Migrationen (hoch, zurueck, hoch) und Abgleich mit den Modellen
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade -1
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini check

      - name: Pytest gegen Postgres
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          # pnpm/action-setup@v4 ist auf 11.7.0 gepinnt, das Node >=22.13
          # voraussetzt (sonst ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite).
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # DEMO_MODE=true statt einer echten API-URL: in CI laeuft kein
      # Backend, ein paar Seiten sind statisch prerendert (siehe next build-
      # Output "○ (Static)") - DEMO_MODE laesst apiGet() ohne Netzwerk-Call
      # sofort die eingebauten Demo-Daten liefern, falls beim Prerendern
      # irgendwo doch ein Fetch ausgeloest wird.
      - name: Build
        env:
          NEXT_PUBLIC_CC_CRM_DEMO_MODE: "true"
        run: pnpm build
